# Digital Ocean App Platform Configuration
name: smart-irrigation-system

services:
- name: irrigation-app
  source_dir: /
  github:
    repo: your-username/smart-irrigation-system
    branch: main
  run_command: npm start
  build_command: npm run build
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  
  envs:
  - key: NODE_ENV
    value: production
  - key: SESSION_SECRET
    type: SECRET
    value: your-session-secret
  - key: DATABASE_URL
    type: SECRET
    value: ${irrigation-db.DATABASE_URL}

  health_check:
    http_path: /api/health

databases:
- name: irrigation-db
  engine: PG
  version: "15"
  size: db-s-dev-database