version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: irrigation_postgres
    environment:
      POSTGRES_DB: irrigation_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: irrigation_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Smart Irrigation Application
  app:
    build: .
    container_name: irrigation_app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:irrigation_password@postgres:5432/irrigation_system
      SESSION_SECRET: your-super-secure-session-secret-change-this
      PORT: 5000
      # Optional: Add weather API keys
      # OPENWEATHER_API_KEY: your-api-key
      # WEATHER_API_KEY: your-api-key
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for session storage (for scaling)
  # redis:
  #   image: redis:7-alpine
  #   container_name: irrigation_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

  # Optional: Nginx reverse proxy
  # nginx:
  #   image: nginx:alpine
  #   container_name: irrigation_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local
  # redis_data:
  #   driver: local

networks:
  default:
    name: irrigation_network